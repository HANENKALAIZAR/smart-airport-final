version: '3.9'

services:

  # ── PostgreSQL Database ────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: smart_airport_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB:       ${DB_NAME:-smart_airport}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend (Gunicorn + Uvicorn workers) ───────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_airport_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DB_HOST:          db
      DB_PORT:          "5432"
      LOG_LEVEL:        info
      WEB_CONCURRENCY:  "2"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Admin Frontend (React / Vite, served by nginx) ────────────────────
  admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: smart_airport_admin
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://backend:8000
      - VITE_APP_ENV=prod

  # ── Passenger Frontend (React / Vite, served by nginx) ────────────────
  passenger:
    build:
      context: ./passenger
      dockerfile: Dockerfile.prod
    container_name: smart_airport_passenger
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      - VITE_API_URL=http://backend:8000/api
      - VITE_APP_ENV=prod

volumes:
  postgres_data:
